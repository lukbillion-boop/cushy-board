ovie on a plane without my bottom going numb."],body:`I'm 63. I worked in hospital admin for 30 years, and the year I retired I started walking every morning. I lost a lot of weight, two dress sizes, which my family doctor and my husband were really happy about. I felt better than I had in years. What nobody mentioned is that I'd lose my padding too.

The first time it happened was on the flight to Lisbon. About three hours in, I noticed I'd started shifting. Left cheek, right cheek, lean forward on the tray table, tuck a leg under. By hour six I couldn't feel my bottom at all. By hour eight the numbness had turned into a burning ache down the backs of my legs.

I spent half that flight standing at the back near the toilets, just so I could feel my legs again, until the crew politely asked me to sit down. Every time I did, it started again.

My husband has always joked about "numb bum" on long flights. It stopped being funny. I couldn't watch a movie, couldn't sleep, couldn't think about anything except where to put my weight. When we landed I walked off like I'd been sitting on a rock for 20 hours, because I had.

I put it down to age. Then I read why it happens. Your weight sits on two small bones, and on a thin economy seat the foam goes flat in the first hour. When you lose a lot of weight, you lose the padding over those two bones too. So the pressure has nowhere to go, and the blood flow gets squeezed off. That's the numbness.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. It puts back the padding I'd lost. And it packs into its own little bag on my carry-on.

On the flight to Vancouver I sat through two movies and a sleep without shifting once. No numbness at hour six, no burning at hour eight. I stood up at the end and my legs just worked.

Was it worth the money? Easily. I'd have paid double for the relief I got. And it's not just for flights. It comes everywhere with me now: the car, the shore excursions, the hard caf\xE9 chairs when I meet my friends for coffee.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

  CB-STATIC-NUMB-WOMEN55-SKELETON-SOLUTION5`},"A03|I01":{angle:"A03",icp:"I01",state:1,mech:"",format:"STORY",style:"NATIVE",narrator:"Woman, 59, Melbourne, parents in England (based on buyer S045)",source:"",hooks:["Twice a year I fly 24 hours to see my parents in England. For years I arrived exhausted, because I hadn't slept a minute of it.","Everyone around me was asleep. I was on my fourth movie, shifting from one side to the other, with eleven hours still to go.","My parents are in their late eighties. Every visit counts. And for years I spent the first two days of every one of them half asleep on their couch.","",""],body:`I'm 59. I live in Melbourne, and my parents are still in Yorkshire, in their late eighties now. I fly over to see them twice a year. Always economy. I can't justify business class twice a year, so I just get on with it.

I used to be able to sleep on planes. Not well, but enough. But somewhere along the way, it changed. These days I can't get comfortable, and if I can't get comfortable, I can't sleep.

It starts a few hours in. A dull ache, then the shifting. I lean on one side, then the other. I try the neck pillow, but my neck isn't the problem. Every time I start to drift off, the ache in my bottom and lower back wakes me up again. I watch movie after movie. Everyone around me is asleep. I'm counting the hours on the flight map.

I tried folding the blanket under me. It went flat within the hour. I walked the aisle. I tried every position the seat allows, which isn't many.

By the time I land at Heathrow, I've been awake for the best part of 24 hours. Then there's the drive north. I arrive at Mum and Dad's and spend the first two days half asleep on their couch, while they try to look after me. It should be the other way around.

It was a real wake-up call, because I only get so many more visits with them, and I was losing two days of every one.

I actually searched "cheap business class flights" one night. There's no such thing.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. And it rolls up small enough to strap to my carry-on in its own bag.

On my last trip, I slept. Properly, for hours, for the first time on that route. No aching bum, even eight hours in. I walked off the plane awake, drove north, and took Mum out for lunch that afternoon.

Was it worth the money? Easily. I'd have paid double for the relief I got. I can book those long economy flights with confidence now. It's as important to me as my passport. And it's not just for flights. It comes with its own little bag, so it comes everywhere with me: the car, the train up north, Mum's hard kitchen chairs.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

That's what actually helped me. I hope it helps you too.`,headlines:["Awake for 24 hours to see my parents","Everyone was asleep except me","I finally slept on a long-haul flight","It wasn't the noise. It was the seat.","I'd have paid double for this"],prompts:["","","","","",""],levels:[{primary:"",headlines:["","",""]},{primary:"",headlines:["","",""]},{primary:"",headlines:["","",""]}],statics:[{id:"s1",n:1,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s2",n:2,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s3",n:3,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s4",n:4,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s5",n:5,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s6",n:6,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s7",n:7,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s8",n:8,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s9",n:9,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""}],spend:"",sales:"",ctr:"",notes:"Image ideas: MAIN: dark economy cabin at night, every passenger asleep under blankets except one woman in her late 50s, wide awake, screen light on her face, shifting in her seat. ALT 1: a woman asleep on a floral couch in an English living room, her elderly mother putting a blanket over her. ALT 2: seat-back flight map showing Melbourne to London with 11 hours remaining."},"A05|I01":{angle:"A05",icp:"I01",state:1,mech:"",format:"STORY",style:"NATIVE",narrator:"Grandmother, 69, retired teacher, Auckland to London (adapted from buyer S035)",source:"adapted from buyer S035",hooks:["My granddaughter ran at me in the arrivals hall at Heathrow, and I couldn't bend down to pick her up. I'd flown 26 hours from Auckland to see her, and my back had locked up somewhere over the Pacific.","We get three weeks with our grandkids in London every second year. For years, the 26-hour flight from Auckland took the first three days of it, and I spent them on my son's couch while everyone else went to the park.","I always thought the hard part of visiting the grandkids was the 26 hours of flying. It's not. It's the three days after, too stiff to do anything, while they keep asking why Nana can't come to the park.","Every time we land in London, I'm the last one off the plane. I sit there and let the whole cabin go first, because after 26 hours from Auckland I know how long it'll take me to stand up straight.","My grandson had been counting down the sleeps until we arrived. On our first morning in London he wanted to walk me to his school, and I had to say no. I was still too sore from the flight to make it to the end of the street."],body:`I'm 69. I taught primary school for 35 years, and I've never been one to sit still. Our son moved to London 12 years ago, and now there are two grandkids, 6 and 9. Every second year my husband and I fly over for three weeks. Always economy. We'd rather spend the money on them.

From Auckland, everywhere is a long way. Fourteen hours to San Francisco, a stopover, then another eleven to London. Most people don't realise how long our flights are, or how long they take to get over. With the grandkids growing up on the other side of the world, every day we get with them counts, and the flight was eating into them.

I used to handle it. A long flight was just a long flight. But somewhere along the way it changed. These days the seat feels like a park bench before we've even left New Zealand.

It starts with a dull ache in my lower back. Then my hips. I shift, I lean on one side, then the other. I tuck my cardigan under me, and it goes flat within the hour. I get up and stand at the back of the plane until the crew ask me to sit down. Every time I sit back down, the ache comes straight back, a little worse than before. Sleep doesn't happen. By the second flight my legs ache and my back is screaming.

When we landed, I let everyone else get off first. I knew I'd be slow, and I didn't want to hold up the aisle while I tried to straighten up.

Then my granddaughter came running. I'd waited two years for that hug, and I had to brace against the trolley to take it.

The next morning she wanted to go to the park. I couldn't. I spent that day on my son's couch while everyone else went out. It took me three days to come right. Three days out of twenty-one with the grandkids, gone because of a plane seat.

It was a real wake-up call, because the next trip was already booked.

My friends said, "That's just what long flights are like at our age." I wasn't ready to accept that. And business class to London for the two of us would have cost more than the whole trip. The point is to see the grandkids, not to price ourselves out of seeing them.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people our age. I ordered two, one for my husband, and tried mine on the recliner first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. And it rolls up small enough to strap to my carry-on in its own bag.

We flew to London in April. I didn't have to wait for everyone to get off. I stood up, grabbed my bag and walked off that plane like a normal person. When my granddaughter ran at me in arrivals, I picked her up. The next morning we were at the park. I arrived without the stiffness or pain I'd feared.

Was it worth the money? Easily. I'd have paid double for the relief I got. And it's not just for flights. It comes with its own little bag, so it comes everywhere with us now: the car, the train, the hard chairs at the kids' school concert. On a trip, you're always sitting somewhere you didn't choose, so I use it more than I ever expected.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

Round 3, 9 Nov: S7, S8 and S9 on-image copy fixed. Cell counts removed and an invented 4.5/5 rating removed. Caught by qc_queue.py before render.`},"A05|I02":{angle:"A05",icp:"I02",state:2,mech:"",format:"STORY",style:"NATIVE",narrator:"Retiree, 68, Tokyo then Rome (based on buyer S022)",source:"",hooks:["30 people on a tour bus in Tokyo watched my husband push me up the steps. It was day two of our Japan trip, the one I'd been waiting my whole life for.","Last year I lost the first two days of the trip I'd waited my whole life for. Not to jet lag. To a plane seat. Funny thing is, I always thought the flight would be the hard part. It wasn't. It was the two days after.","When I was younger, I thought business class was about the champagne and the legroom. Now I'm retired, I know what people are really paying for. I found out the hard way, on the flight to my dream holiday in Japan.","My friends told me losing the first days of a big trip is just part of getting old. I believed them, until a 10-hour flight to Japan left me too stiff to climb onto our tour bus on day two of the trip I'd saved my whole life for.","I'd saved my whole life for our retirement trip to Japan. Ten hours later, I was the last passenger still sitting on the plane, waiting for the aisle to clear because I knew how long it would take me to stand up straight. I lost the next two days of that trip in a hotel room."],body:`I'm 68. I worked in an office for 40 years, and every holiday had to fit around my annual leave. A week here, a long weekend there. Never far, never long. We always said that when we retired, we'd finally do it properly. So last year, we booked Tokyo.

I used to fly a couple of times a year, and a long flight was just a long flight. But somewhere along the way, I don't remember when, it changed. This time, it felt like sitting on concrete.

It started with a dull ache. Then I was shifting around, crossing my legs, uncrossing them, trying to find any position that didn't hurt. I put a movie on to take my mind off it, and halfway through I realised I hadn't taken in a single scene, because all I could think about was my hips. I got up and stood at the back of the plane. Sat down. Got up again. Every time I sat back down, the ache came straight back, and each time it was worse than before.

I asked the flight attendant for extra pillows, and rolled up my cardigan to sit on. It went flat within the hour, and the pillows kept sliding off. She was lovely, but there was nothing she could do. Everyone around me seemed fine. It just kept getting worse the longer I sat, with pain shooting through my lower back and down my legs.

When we finally landed, I was sitting near the front. But I knew how slowly I'd be getting up, so I waited and let everyone else go first. I didn't want to hold up the whole aisle while I tried to straighten my back and ease the pain enough to walk. All I wanted was to stand and stretch, and I had to sit there and wait.

Then came an hour in the car to the hotel. Another hard seat. I remember thinking, I just want to lie down flat and get the weight off my hips. I wished I'd had something I could use on the plane and in that car.

We'd planned a full first day. I cancelled all of it and spent the day in the hotel, trying to recover.

The next morning, the tour bus was waiting. My hips and lower back had locked. I gripped the handrail, my husband pushed from behind, and the whole bus watched me struggle up those stairs. I spent that afternoon in the hotel room instead of at the temple I'd booked the whole trip to see.

Two days of my first retirement trip, the one I'd worked my whole life for, gone because of a plane seat.

It was a real wake-up call. Because this year we'd booked the big one: five weeks in Italy and Greece. More than 22 hours of flying each way.

My friends said, "That's just what long flights are like at our age." I wasn't ready to accept that. And business class to Rome would have cost more than the whole holiday. The point of retirement was to finally afford these trips, not to price ourselves out of them.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. And it rolls up small enough to strap to my carry-on in its own bag.

We flew to Rome last month. I didn't have to wait for everyone to get off. I stood up, grabbed my bag and walked off that plane like a normal person. I used it in the car to the hotel too. And on day one, I was standing in the Colosseum, not lying in a hotel room. I arrived without the stiffness or pain I'd feared.

Was it worth the money? Easily. I'd have paid double for the relief I got. We ended up getting two, one for my husband as well, which worked out cheaper. And it's not just for flights. It comes with its own little bag, so it comes everywhere with us now: the car, the tour bus, the hard caf\xE9 chairs when I meet my friends for coffee. On a trip, you're always sitting somewhere you didn't choose, so I use it more than I ever expected.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

That's what actually helped me. I hope it helps you too.`,headlines:["30 people watched him push me up the steps","Day two of my dream trip, and I couldn't get on the bus","Not jet lag. A plane seat.","It wasn't my age. It was the seat.","I'd have paid double for this"],prompts:["","","","","",""],levels:[{primary:`You waited your whole working life for this trip. Do not spend the first two days of it in the hotel.

Round 2, 9 Nov: awareness copy rewritten in the company's voice, not the narrator's. Images redone: S1, S2, S4, S5, S6, S7, S8. Kept: S3 and S9.`},"A05|I11":{angle:"A05",icp:"I11",state:1,mech:"",format:"STORY",style:"NATIVE",narrator:"Retired woman, 63, lost a lot of weight walking (based on buyer S059)",source:"",hooks:["At 61 I finally lost the weight I'd carried for 20 years. I was so proud. Then I sat down for a 20-hour flight to Lisbon and couldn't last an hour without shifting from cheek to cheek. Nobody warned me about that part.","I used to sleep the whole way to London. Two dress sizes later, I spent the whole flight sitting on my hands and pacing the aisle at 3am, then the first two days of the trip flat on a hotel bed.","My doctor was thrilled I'd finally lost the weight I'd carried for years. Nobody warned me what it would do to my bottom on a 20-hour flight. Halfway to Lisbon I could feel the bar under the seat, and by the time we landed I couldn't stand up straight. I couldn't face another holiday that started in a hotel bed.","Nobody told me that losing 60 pounds in a year would make flying so much harder. I used to think fighting over the armrest was the worst part of a long flight. Then I spent 20 hours to Lisbon sitting on my hands, and the first two days of the trip flat on my back.","I lost a lot of weight after I retired and felt better than I had in years. Right up until I walked off a 20-hour flight like I was 90."],body:`I'm 63. I worked in hospital admin for 30 years, and the year I retired I started walking every morning. I lost a lot of weight, two dress sizes, which my family doctor and my husband were really happy about. I felt better than I had in years. What nobody mentioned is that I'd lose my padding too.

In my forties I flew to London twice and slept most of the way. A long flight was just a long flight. But since the weight came off, it changed. Last year we flew to Portugal, and within the first hour the seat felt like concrete.

It started with a dull ache. Then I could feel the bar under the seat. I shifted from one cheek to the other, leaned on the tray table, tucked a leg under me, sat on my hands. I put a movie on and couldn't follow a single scene, because all I could think about was where to put my weight. I got up and stood at the back of the plane. Sat down. Got up again. Every time I sat back down, the ache came straight back, and each time it was worse than before.

I asked the flight attendant for an extra pillow and rolled up my cardigan to sit on. It went flat within the hour, and the pillow kept sliding off. Everyone around me was asleep. I was up the whole night.

When we finally landed, I waited and let everyone else go first. I knew how slowly I'd be getting up, and I didn't want to hold up the whole aisle while I tried to straighten my back enough to walk.

Then came an hour in a taxi to the hotel. Another hard seat. All I wanted was to lie down flat and get the weight off.

We'd planned a full first day in Lisbon. I cancelled all of it and spent the day in the hotel, trying to recover. The next morning my legs were still sore.

Two days of the trip we'd saved for, gone because of a plane seat.

It was a real wake-up call. Because this year we'd booked the big one: a cruise to Alaska, with 20-odd hours of flying to get to Vancouver.

My friends said, "That's just what long flights are like at our age." I wasn't ready to accept that.

Then I read something that finally made sense of it. When you lose a lot of weight, you lose the natural padding you sit on, and after 55 most of us lose some of it anyway. Economy seats have a thin layer of foam that goes flat in the first hour. Put the two together and there's nothing between you and the seat frame for 20 hours. That was the shifting, the pacing, the sitting on my hands. And it's why I was arriving wrecked.

Business class to Vancouver would have cost more than the cruise. The point of retirement was to finally afford these trips, not to price ourselves out of them.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. It puts back the padding I'd lost. And it packs into its own little bag on my carry-on.

We flew to Vancouver last month. I didn't have to wait for everyone to get off. I stood up, grabbed my bag and walked off that plane like a normal person. That afternoon I was on the deck of the ship, not lying in a hotel room. I arrived without the stiffness or pain I'd feared.

Was it worth the money? Easily. I'd have paid double for the relief I got. And it's not just for flights. It comes with its own little bag, so it comes everywhere with me now: the car, the shore excursions, the hard caf\xE9 chairs when I meet my friends for coffee. On a trip, you're always sitting somewhere you didn't choose, so I use it more than I ever expected.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

Round 2, 9 Nov: awareness copy rewritten in the company's voice. Images unchanged, all approved.`},"A06|I11":{angle:"A06",icp:"I11",state:1,mech:"",format:"STORY",style:"NATIVE",narrator:"Retired woman, 63, lost a lot of weight walking (same narrator as A3)",source:"",hooks:["After I lost the weight, I priced business class for the first time in my life. Not for the champagne. Because I didn't think I could physically sit in economy for 20 hours anymore.","Business class to Vancouver for the two of us was more than the whole cruise. I nearly paid it anyway, because I couldn't face another 20 hours in economy with nothing left to sit on.","When I was younger I thought business class was about the legroom and the wine. At 63, two dress sizes smaller, I finally understood what people are really paying for.","My husband got upgraded once and slept 14 hours. I asked him what made the difference. It wasn't the bed, the food or the wine. It was one thing I could buy for economy.","I spent a year losing the weight, then nearly spent our cruise money on business class because economy seats suddenly felt like concrete."],body:`I'm 63. I worked in hospital admin for 30 years, and the year I retired I started walking every morning. I lost a lot of weight, two dress sizes, which my family doctor and my husband were really happy about. I felt better than I had in years. What nobody mentioned is that I'd lose my padding too.

Before the weight came off, I could sleep anywhere. Economy was fine. Then on our trip to Lisbon last year, I couldn't sit for more than an hour. I shifted, stood at the back, sat on my hands. I arrived so sore I lost the first two days of the holiday.

This year we'd booked a cruise to Alaska, with 20-odd hours of flying to Vancouver. So for the first time in my life, I priced business class. Not for the champagne. Because I genuinely didn't think I could sit in economy for that long anymore.

For the two of us, it was more than the whole cruise. I sat at the kitchen table looking at that number for a long time.

My husband had been upgraded once, years ago, on a work trip. He said the thing he remembered wasn't the food or the wine. It was that the seat was soft enough to sit on for 14 hours.

That's when it clicked. Most of what business class sells you is a better place to sit. More padding under you. And that was exactly what I'd lost.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. It puts back the padding I'd lost. And it packs into its own little bag on my carry-on.

We flew to Vancouver in economy last month, both of us on one. I slept. I walked off the plane like a normal person, and that afternoon I was on the deck of the ship with a glass of wine, feeling like I'd flown at the front. We spent the business class money on the trip instead.

Was it worth the money? Easily. I'd have paid double for the relief I got. And it's not just for flights. It comes everywhere with me now: the car, the shore excursions, the hard caf\xE9 chairs when I meet my friends for coffee.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

Export label B2.`},"A09|I09":{angle:"A09",icp:"I09",state:1,mech:"",format:"STORY",style:"NATIVE",narrator:"Wife, 66, buying for her husband (based on buyer S036)",source:"",hooks:["My husband doesn't travel well. Long flights play havoc with his back, and with his mood. After 38 years, I know exactly what hour six sounds like.","I'd love to tell you I bought this for myself. I didn't. I bought it so I wouldn't have to listen to my husband complain for an entire flight.","Every trip, at about hour four, my husband starts sighing. By hour six he's standing at the back of the plane. By the time we land, neither of us is enjoying the holiday.","",""],body:`I'm 66. We've been married 38 years, and we love to travel. Or at least, I do. My husband has always tolerated flights. Then last November his back started playing up, and since then every flight has been a trial. For him, and for me.

It goes the same way every time. The first couple of hours are fine. Then he starts shifting. He crosses his legs, uncrosses them, leans on one side, then the other. Then the sighing starts. Then he's up, standing at the back of the plane, until the crew ask him to sit down. Every time he sits back down, it starts again.

I can't sleep, because he can't sit still. I can't read, because he keeps asking how long to go. Six hours feels like twelve.

I tried. I packed a little cushion for him, and it went flat within the hour. I rolled up his jacket for him to sit on, and he gave up on it. The airline pillow kept sliding off.

By the time we landed, he was stiff, sore and grumpy, and the first evening of the holiday was gone. Not because of anything either of us did. Because of a plane seat.

It was a real wake-up call, because we had our daughter's Christmas booked, and I couldn't face another trip like that.

Business class for two would have cost more than the whole trip, so that wasn't happening.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people our age. So I ordered two and made him try his on the recliner first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. And it rolls up small enough to strap to a carry-on in its own bag.

He tested it on two six-hour flights. He sat there and read his book. No sighing. No standing at the back. When we landed, he said his rump and his back hadn't bothered him once. Other passengers kept eyeing it. He's started calling it his cure for numb-bum-itis.

Was it worth the money? Easily. I'd have paid double for the peace and quiet. I kept the second one, and it lives on my rocking chair between trips. And it's not just for flights. It comes with its own little bag, so it comes everywhere with us now: the car, the train, the hard seats at the grandkids' concerts.

I really didn't think this was something that could be fixed. I thought it was just him getting older. It wasn't.

If there's someone in your life who dreads every flight, this is what actually helped us. I hope it helps you too.`,headlines:["I bought it so he'd stop complaining","Hour six. The sighing starts.","The best gift I've bought him in years","It wasn't his age. It was the seat.","Get two. Trust me."],prompts:["","","","","",""],levels:[{primary:"",headlines:["","",""]},{primary:"",headlines:["","",""]},{primary:"",headlines:["","",""]}],statics:[{id:"s1",n:1,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s2",n:2,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s3",n:3,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s4",n:4,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s5",n:5,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s6",n:6,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s7",n:7,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s8",n:8,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""},{id:"s9",n:9,title:"",onimage:"",headline:"",sub:"",prompt:"",ref:""}],spend:"",sales:"",ctr:"",notes:`Timed for Christmas gifting with the 2-pack.

I've always been on the thin side. I joke that I've got a bony backside. My husband is the opposite. Getting comfortable on a plane has never been easy for either of us, but we managed.

Then, somewhere along the way, it changed. The seats started to feel harder. I don't know if it's the newer planes or me, but last trip it felt like sitting on a board.

By hour three I could feel the bones in my bottom pressing into the seat. I shifted onto one side, then the other. I perched on the edge and leaned on the tray table. I folded the airline blanket under me, and it was flat within the hour. Next to me, my husband was squeezed in and shifting just as much. Neither of us slept.

Seventeen hours of that. By the time we landed in Rome, I was so sore I couldn't sit through dinner. I stood up through half of it. It stayed sore for days.

It was a real wake-up call, because we go back every year and we're not getting any younger.

I actually typed "how much is first class" into Google one night. For the two of us, it was more than the rest of the trip combined. I closed the laptop.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. And it rolls up small enough to strap to my carry-on in its own bag.

On our last trip we both had one. I sat back in my seat for the first time in years. I slept. We both did. We even drank less wine on the flight, because we were actually sleeping. I walked off that plane in Rome and sat through dinner like a normal person.

Was it worth the money? Easily. I'd have paid double for the relief I got. We ended up buying three: one each, and one for a friend who'd broken her pelvis. And it's not just for flights. It comes with its own little bag, so it comes everywhere with us now: the car, the train, the hard caf\xE9 chairs in Italy. On a trip, you're always sitting somewhere you didn't choose, so I use it more than I ever expected.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.

Export label D1.`},"A11|I11":{angle:"A11",icp:"I11",state:2,mech:"",format:"STORY",style:"NATIVE",narrator:"Retired woman, 63, lost a lot of weight walking (same narrator as A3)",source:"",hooks:["I swear plane seats used to be softer. I've flown to London every few years since my forties, and last trip it felt like sitting on a park bench for 22 hours. I wasn't imagining it. It was two things at once.","Either the airlines took the padding out of the seats, or I lost mine. After I dropped two dress sizes, I found out it was both.","Same route, same airline, same economy seat I've sat in for twenty years. This time I could feel the metal bar under me before we'd even taken off.","My husband thinks I'm exaggerating about the seats. He hasn't lost 60 pounds. By hour three to London I could feel every bar in the frame, and he slept the whole way.","At 63 I'm the fittest I've ever been. So why does an economy seat feel harder every single time I fly?"],body:`I'm 63. I worked in hospital admin for 30 years, and the year I retired I started walking every morning. I lost a lot of weight, two dress sizes, which my family doctor and my husband were really happy about. I felt better than I had in years. What nobody mentioned is that I'd lose my padding too.

We've flown Sydney to London every few years since my forties to see my sister. Always economy. A long flight was just a long flight. I'd read, watch a movie, doze off somewhere over India.

But the last two trips, something about the seats was different. Within an hour it felt like sitting on a park bench. By hour three I could feel the metal bar under the seat through the cushion. I shifted onto one cheek, then the other. I folded the airline blanket under me. It was flat before the drinks trolley came round.

I kept saying to my husband, "These seats are harder than they used to be." He thought I was imagining it. He sat there and slept.

By the time we landed at Heathrow I couldn't stand up straight. I spent the first two days at my sister's lying on her couch, which is not how either of us wanted to spend our time together.

It was a real wake-up call, because we'd already booked our next trip.

So I did some reading. I wasn't imagining it. Airlines have been fitting thinner, lighter seats to save fuel, and the foam in economy goes flat in the first hour anyway. And when you lose a lot of weight, you lose the natural padding you sit on. Thinner seat, thinner me. There was nothing left between me and the frame.

Then I saw the Cushy Bum on Facebook. My first thought was, gimmick. I've seen the cheap blow-up cushions, and they're one big balloon you sink straight through. But this one was different. It's made of lots of separate air cells instead of one big bubble. It was an Australian brand with 60-day returns, and the reviews were from people my age. So I ordered one and tried it on my dining chair first.

I was surprised it worked so well, because it's just air. But because it's air, not foam, it can't go flat on you. You set the firmness you like, and the air cells spread your weight across the whole seat, so it's not all pressing into two sore spots. It puts back the padding I'd lost. And it packs into its own little bag on my carry-on.

On the next trip to London I sat back in my seat, watched three movies and actually slept. No bar under me. I walked off the plane, hugged my sister at arrivals, and we went out for lunch that afternoon.

Was it worth the money? Easily. I'd have paid double for the relief I got. And it's not just for flights. It comes everywhere with me now: the car, the shore excursions, the hard caf\xE9 chairs when I meet my friends for coffee.

I really didn't think this was something that could be fixed. I thought it was just part of getting older. It wasn't.
